[app]
name = Periodic Table 3D
version = 0.1.0
theme = dark
language = en

[display]
showAtomicNumber = true
showAtomicMass = true
showElectronConfig = true
defaultZoom = 1.0
animationSpeed = 1.0

[3d]
enableOrbitControls = true
autoRotate = false
backgroundColor = #0a0a1a
atomScale = 1.0
showElectronClouds = true
showNucleus = true

[tools]
enableCombination = true
maxCombineElements = 4
showReactionPreview = true

[window]
width = 1400
height = 900
minWidth = 1024
minHeight = 700
